<rect class="f-brandpale" x="35" y="496" width="1161" height="118" rx="10"/>
<text class="f-brand fs-15" x="57" y="522" font-weight="700" text-anchor="start" letter-spacing="0">この設計の根拠と効果</text>
<text class="f-ink fs-12" x="57" y="546" font-weight="400" text-anchor="start" letter-spacing="0">・地域福祉計画は「概ね5年・3年で見直し」が適当（平成14年 社会保障審議会福祉部会）。中間見直しを令和11年度に置きます。</text>
<text class="f-ink fs-12" x="57" y="567" font-weight="400" text-anchor="start" letter-spacing="0">・障がい福祉計画等は令和9〜11年度（告示第4号）、介護保険事業計画は3年一期（法第117条）。いずれも令和11年度末に終了します。</text>
<text class="f-ink fs-12" x="57" y="588" font-weight="400" text-anchor="start" letter-spacing="0">・こども計画も令和7〜11年度で改定済みのため、令和11年度末に4計画の期間が揃い、次々期改定を一体的に検討できます。</text>
<text class="f-muted fs-11" x="57" y="630" font-weight="400" text-anchor="start" letter-spacing="0">※ 第2期地域福祉計画（令和2〜6年度）は計画期間が満了。令和7〜8年度の運用状況は契約後に町へご確認のうえ整理します。</text>

