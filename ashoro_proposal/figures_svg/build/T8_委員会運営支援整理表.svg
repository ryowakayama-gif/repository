<rect class="f-surface" width="1240" height="480"/>
<rect class="f-accent" x="34" y="30" width="5" height="24" rx="2.5"/>
<text class="f-ink fs-23" x="50" y="50" font-weight="700">委員会運営支援 想定回数・範囲の整理</text>
<text class="f-muted fs-13_5" x="50" y="74" font-weight="400">仕様書5(1)⑤は「運営支援」の範囲・回数・出席義務を明記していないため、提案書側で前提を明示します</text>

<rect class="f-brand" x="35" y="112" width="1170" height="34" rx="6"/>
<text class="f-onbrand fs-12_5" x="130" y="134" font-weight="700" text-anchor="middle">対象組織</text>
<text class="f-onbrand fs-12_5" x="330" y="134" font-weight="700" text-anchor="middle">想定開催回数・時期</text>
<text class="f-onbrand fs-12_5" x="640" y="134" font-weight="700" text-anchor="middle">受託者の関与範囲（提案）</text>
<text class="f-onbrand fs-12_5" x="1000" y="134" font-weight="700" text-anchor="middle">未確定・要協議事項</text>

<g class="f-ink fs-12">

<rect class="f-surfalt" x="35" y="146" width="1170" height="66"/>
<text x="130" y="172" text-anchor="middle" font-weight="700">地域福祉計画</text>
<text x="130" y="190" text-anchor="middle" font-weight="700">策定委員会</text>
<text x="330" y="180" text-anchor="middle">2回＋書面審議1回（11月頃）</text>
<text x="330" y="198" text-anchor="middle">前回実績と同数。書面審議を併用</text>
<text x="640" y="180" text-anchor="middle">会議資料の作成、調査結果速報の説明、</text>
<text x="640" y="198" text-anchor="middle">当日出席・進行補助</text>
<text x="1000" y="189" text-anchor="middle">出席の要否・追加開催の可否</text>

<rect class="f-surface" x="35" y="212" width="1170" height="66"/>
<text x="130" y="238" text-anchor="middle" font-weight="700">障害者自立支援</text>
<text x="130" y="256" text-anchor="middle" font-weight="700">協議会</text>
<text x="330" y="246" text-anchor="middle">2回（11月頃）</text>
<text x="330" y="264" text-anchor="middle">前回実績と同数。定例会と調整</text>
<text x="640" y="246" text-anchor="middle">会議資料の作成、調査結果速報の説明、</text>
<text x="640" y="264" text-anchor="middle">当日出席・進行補助</text>
<text x="1000" y="255" text-anchor="middle">既存定例会との日程調整</text>

<rect class="f-surfalt" x="35" y="278" width="1170" height="66"/>
<text x="130" y="304" text-anchor="middle" font-weight="700">庁内連絡会議</text>
<text x="130" y="322" text-anchor="middle" font-weight="700">（任意）</text>
<text x="330" y="311" text-anchor="middle">1〜2回</text>
<text x="640" y="304" text-anchor="middle">進捗共有資料の作成、質疑対応</text>
<text x="640" y="322" text-anchor="middle">（前回・地域福祉計画では計5回開催実績）</text>
<text x="1000" y="311" text-anchor="middle">開催有無・頻度</text>
</g>

<rect class="s-border" x="35" y="112" width="1170" height="232" fill="none" stroke-width="1.2"/>
<line class="s-border" x1="225" y1="112" x2="225" y2="344" stroke-width="0.8"/>
<line class="s-border" x1="435" y1="112" x2="435" y2="344" stroke-width="0.8"/>
<line class="s-border" x1="845" y1="112" x2="845" y2="344" stroke-width="0.8"/>

<rect class="f-accentpale s-accent" x="35" y="364" width="1170" height="100" rx="10" stroke-width="1.2"/>
<text class="f-accent fs-13" x="57" y="390" font-weight="700">見積・提案書への反映方法</text>
<text class="f-ink fs-12" x="57" y="414">基本回数は前回実績と同数（地域福祉2回＋書面1回・障がい2回）とし、見積内訳に明記します。</text>
<text class="f-ink fs-12" x="57" y="436">追加開催は契約後の協議事項とし、履行期限内で町が必要と判断する回数のご支援には対応します。</text>
<text class="f-muted fs-11" x="57" y="454">※前回の地域福祉計画は策定委員会2回＋書面1回、障がい計画は自立支援協議会2回の実績。</text>
</svg>
