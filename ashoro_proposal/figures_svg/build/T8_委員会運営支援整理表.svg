<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 480" class="bzu-fig" role="img" aria-labelledby="fig-t8-t fig-t8-d" preserveAspectRatio="xMidYMid meet">
<title id="fig-t8-t">委員会運営支援 想定回数・範囲の整理</title>
<desc id="fig-t8-d">仕様書5(1)⑤は「運営支援」の範囲・回数・出席義務を明記していないため、提案書側で前提を明示します</desc>
<style>
