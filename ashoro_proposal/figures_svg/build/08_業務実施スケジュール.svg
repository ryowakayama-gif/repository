<text class="f-ink fs-12_5" x="55" y="185" font-weight="400" text-anchor="start" letter-spacing="0">① 契約締結・キックオフ協議</text>
<text class="f-ink fs-12_5" x="55" y="226" font-weight="400" text-anchor="start" letter-spacing="0">② 基礎的な地域データ・統計資料の分析</text>
<text class="f-ink fs-12_5" x="55" y="267" font-weight="400" text-anchor="start" letter-spacing="0">③ 庁内関係課への調査（子ども・高齢者・教育委員会等）</text>
<text class="f-ink fs-12_5" x="55" y="308" font-weight="400" text-anchor="start" letter-spacing="0">④ 関係団体等への調査（社協・事業者・自治会等）</text>
<text class="f-ink fs-12_5" x="55" y="349" font-weight="400" text-anchor="start" letter-spacing="0">⑤ 町民・障がい者調査票の確定・印刷</text>
<text class="f-ink fs-12_5" x="55" y="390" font-weight="400" text-anchor="start" letter-spacing="0">⑥ 名簿提供（町）・宛名作成・封入封緘・発送（受託者）</text>
<text class="f-ink fs-12_5" x="55" y="431" font-weight="400" text-anchor="start" letter-spacing="0">⑦ 回収・督促</text>
<text class="f-ink fs-12_5" x="55" y="472" font-weight="400" text-anchor="start" letter-spacing="0">⑧ データ入力・点検（匿名化）</text>
<text class="f-ink fs-12_5" x="55" y="513" font-weight="400" text-anchor="start" letter-spacing="0">⑨ 集計・分析（ウェイトバック集計を含む）</text>
<text class="f-ink fs-12_5" x="55" y="554" font-weight="400" text-anchor="start" letter-spacing="0">⑩ 調査結果報告書・とりまとめ資料の作成</text>
<text class="f-ink fs-12_5" x="55" y="595" font-weight="400" text-anchor="start" letter-spacing="0">⑪ 成果品の納品（履行期限 令和8年12月28日）</text>
<text class="f-brand fs-12_5" x="55" y="636" font-weight="700" text-anchor="start" letter-spacing="0">⑫ 策定委員会・自立支援協議会の運営支援（各1〜2回・見積り上の前提）</text>

