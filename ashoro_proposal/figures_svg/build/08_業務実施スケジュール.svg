<text class="f-muted fs-13_5" x="50" y="74" font-weight="400" text-anchor="start" letter-spacing="0">履行期間（契約締結日〜令和8年12月28日）に対応した5か月工程。地域福祉計画・障がい者福祉計画等を並行して実施します</text>

