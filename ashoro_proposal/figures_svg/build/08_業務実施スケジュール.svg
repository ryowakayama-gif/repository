<title id="fig-08-t">業務実施スケジュール（想定）</title>
<desc id="fig-08-d">履行期間（契約締結日〜令和8年12月28日）に対応した5か月工程。地域福祉計画・障がい者福祉計画等を並行して実施します</desc>
