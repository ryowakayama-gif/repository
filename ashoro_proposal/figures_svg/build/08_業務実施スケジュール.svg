<rect class="f-accentpale s-accent" x="35" y="698" width="1165" height="86" rx="8" stroke-width="1.2"/>
<text class="f-accent fs-12_5" x="55" y="721" font-weight="700" text-anchor="start" letter-spacing="0">【成果品の範囲について】</text>
<text class="f-ink fs-12" x="55" y="742" font-weight="400" text-anchor="start" letter-spacing="0">調査票は9月上旬までに町の承認をいただき、印刷・発送前に再修正5営業日と予備日3営業日を確保します。</text>
<text class="f-ink fs-12" x="55" y="761" font-weight="400" text-anchor="start" letter-spacing="0">成果品はアンケート調査報告書及び関係団体等・庁内関係課の調査とりまとめ資料です。</text>
<text class="f-ink fs-12" x="55" y="780" font-weight="400" text-anchor="start" letter-spacing="0">計画素案の作成・パブリックコメント・計画確定は履行期限後、町が引き継ぐ想定です。</text>
