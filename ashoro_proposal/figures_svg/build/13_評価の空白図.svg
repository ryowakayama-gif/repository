<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 680" class="bzu-fig" role="img" aria-labelledby="fig-13-t fig-13-d" preserveAspectRatio="xMidYMid meet">
<title id="fig-13-t">現行・地域福祉計画における横断的な評価の位置づけ</title>
<desc id="fig-13-d">第2期計画・第5章第4節(3)より。全分野が他計画の審議会に委任され、計画自体を横断的に評価する仕組みの明示が弱い状態です</desc>
