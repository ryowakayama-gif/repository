<text class="f-ink fs-16" x="146.4" y="186" font-weight="700" text-anchor="middle" letter-spacing="0">調査結果の把握</text>
<text class="f-muted fs-11_5" x="146.4" y="216" font-weight="400" text-anchor="middle" letter-spacing="0">設問ごとの集計結果</text>
<text class="f-muted fs-11_5" x="146.4" y="238" font-weight="400" text-anchor="middle" letter-spacing="0">属性別・経年の差異</text>
<path class="f-brand2" d="M258.8,187.0 L270.8,195 L258.8,203.0 Z"/>
<rect class="f-surface s-brand" x="271.8" y="120" width="222.8" height="150" rx="10" stroke-width="1.6"/>
