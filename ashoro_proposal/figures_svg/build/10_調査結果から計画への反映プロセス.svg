<text class="f-ink fs-16" x="620.0" y="186" font-weight="700" text-anchor="middle" letter-spacing="0">施策への反映</text>
<text class="f-muted fs-11_5" x="620.0" y="216" font-weight="400" text-anchor="middle" letter-spacing="0">既存施策の見直し</text>
<text class="f-muted fs-11_5" x="620.0" y="238" font-weight="400" text-anchor="middle" letter-spacing="0">新規施策の位置づけ</text>
<path class="f-accent" d="M732.4000000000001,187.0 L744.4000000000001,195 L732.4000000000001,203.0 Z"/>
<rect class="f-surface s-accent" x="745.4000000000001" y="120" width="222.8" height="150" rx="10" stroke-width="1.6"/>
<rect class="f-accent" x="745.4000000000001" y="120" width="222.8" height="34" rx="10"/>
<rect class="f-accent" x="745.4000000000001" y="144" width="222.8" height="10" rx="8"/>
<text class="f-onaccent fs-13" x="856.8000000000001" y="143" font-weight="700" text-anchor="middle" letter-spacing="0">STEP 4</text>
<text class="f-ink fs-16" x="856.8000000000001" y="186" font-weight="700" text-anchor="middle" letter-spacing="0">成果指標の設定</text>
<text class="f-muted fs-11_5" x="856.8000000000001" y="216" font-weight="400" text-anchor="middle" letter-spacing="0">調査値を基準値に設定</text>
<text class="f-muted fs-11_5" x="856.8000000000001" y="238" font-weight="400" text-anchor="middle" letter-spacing="0">次期調査での目標値</text>
<path class="f-accent" d="M969.2,187.0 L981.2,195 L969.2,203.0 Z"/>
<rect class="f-surface s-accent" x="982.2" y="120" width="222.8" height="150" rx="10" stroke-width="1.6"/>
<rect class="f-accent" x="982.2" y="120" width="222.8" height="34" rx="10"/>
<rect class="f-accent" x="982.2" y="144" width="222.8" height="10" rx="8"/>
<text class="f-onaccent fs-13" x="1093.6000000000001" y="143" font-weight="700" text-anchor="middle" letter-spacing="0">STEP 5</text>
<text class="f-ink fs-16" x="1093.6000000000001" y="186" font-weight="700" text-anchor="middle" letter-spacing="0">進捗管理・評価</text>
<text class="f-muted fs-11_5" x="1093.6000000000001" y="216" font-weight="400" text-anchor="middle" letter-spacing="0">毎年度の点検・評価</text>
<text class="f-muted fs-11_5" x="1093.6000000000001" y="238" font-weight="400" text-anchor="middle" letter-spacing="0">次期計画への引継ぎ</text>
<rect class="f-surfalt s-border" x="35" y="300" width="1170" height="168" rx="10" stroke-width="1.2"/>
<rect class="f-accent" x="57" y="318" width="100" height="26" rx="13.0"/>
<text class="f-onaccent fs-13" x="107.0" y="335.68" font-weight="700" text-anchor="middle" letter-spacing="0">反映例</text>
<text class="f-muted fs-13" x="169" y="337" font-weight="400" text-anchor="start" letter-spacing="0">地域福祉計画・障害者計画に共通する典型的なつながり</text>
<rect class="f-surface s-border" x="41.0" y="356" width="210.8" height="96" rx="8" stroke-width="1.2"/>
<text class="f-ink fs-12" x="146.4" y="392" font-weight="700" text-anchor="middle" letter-spacing="0">民生委員・児童委員を</text>
<text class="f-ink fs-12" x="146.4" y="414" font-weight="700" text-anchor="middle" letter-spacing="0">「知らない」38.5%</text>
<path class="f-accent" d="M253.8,396.0 L265.8,404 L253.8,412.0 Z"/>
<rect class="f-surface s-border" x="277.8" y="356" width="210.8" height="96" rx="8" stroke-width="1.2"/>
<text class="f-ink fs-12" x="383.20000000000005" y="380" font-weight="400" text-anchor="middle" letter-spacing="0">30歳代79.5%</text>
<text class="f-ink fs-12" x="383.20000000000005" y="402" font-weight="400" text-anchor="middle" letter-spacing="0">（n=39）と高く、</text>
<text class="f-ink fs-12" x="383.20000000000005" y="424" font-weight="400" text-anchor="middle" letter-spacing="0">子育て世代で接点薄い</text>
<path class="f-accent" d="M490.6,396.0 L502.6,404 L490.6,412.0 Z"/>
<rect class="f-surface s-border" x="514.6" y="356" width="210.8" height="96" rx="8" stroke-width="1.2"/>
<text class="f-ink fs-12" x="620.0" y="392" font-weight="400" text-anchor="middle" letter-spacing="0">「身近な相談者の周知」を</text>
<text class="f-ink fs-12" x="620.0" y="414" font-weight="400" text-anchor="middle" letter-spacing="0">重点施策として位置づけ</text>
<path class="f-accent" d="M727.4000000000001,396.0 L739.4000000000001,404 L727.4000000000001,412.0 Z"/>
<rect class="f-surface s-border" x="751.4000000000001" y="356" width="210.8" height="96" rx="8" stroke-width="1.2"/>
<text class="f-ink fs-12" x="856.8000000000001" y="392" font-weight="700" text-anchor="middle" letter-spacing="0">認知度 前回値59.7%</text>
<text class="f-ink fs-12" x="856.8000000000001" y="414" font-weight="700" text-anchor="middle" letter-spacing="0">補正参考値 約56.1%</text>
<path class="f-accent" d="M964.2,396.0 L976.2,404 L964.2,412.0 Z"/>
<rect class="f-surface s-border" x="988.2" y="356" width="210.8" height="96" rx="8" stroke-width="1.2"/>
<text class="f-ink fs-12" x="1093.6000000000001" y="380" font-weight="400" text-anchor="middle" letter-spacing="0">目標70%は委員会</text>
<text class="f-ink fs-12" x="1093.6000000000001" y="402" font-weight="400" text-anchor="middle" letter-spacing="0">協議に付す設定例。</text>
<text class="f-ink fs-12" x="1093.6000000000001" y="424" font-weight="400" text-anchor="middle" letter-spacing="0">次期調査で検証します</text>
<rect class="f-brandpale" x="35" y="490" width="1170" height="78" rx="10"/>
<text class="f-brand fs-15" x="59" y="520" font-weight="700" text-anchor="start" letter-spacing="0">本業務での具体的な成果物</text>
<text class="f-ink fs-12_5" x="59" y="546" font-weight="400" text-anchor="start" letter-spacing="0">設問ごとに「事実 → 課題 → 施策 → 成果指標（基準値・目標値）」を整理した対照表を納品します。基準値は補正前後を併記します。</text>
