<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 600" class="bzu-fig" role="img" aria-labelledby="fig-10-t fig-10-d" preserveAspectRatio="xMidYMid meet">
<title id="fig-10-t">アンケート結果を計画に反映させるプロセス</title>
<desc id="fig-10-d">「調査のための調査」で終わらせず、課題・施策・成果指標まで一本の線でつなぎます（計画素案の作成は本業務の範囲外）</desc>
<style>
/* ==== 可変トークン ====
   外側の CSS で :root や任意の親要素に
   --c-brand などを定義すれば、この図の配色を一括変更できます。
