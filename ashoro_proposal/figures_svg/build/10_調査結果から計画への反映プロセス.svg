<text class="f-ink fs-23" x="50" y="50" font-weight="700" text-anchor="start" letter-spacing="0.5">アンケート結果を計画に反映させるプロセス</text>
<text class="f-muted fs-13_5" x="50" y="74" font-weight="400" text-anchor="start" letter-spacing="0">「調査のための調査」で終わらせず、課題・施策・成果指標まで一本の線でつなぎます（計画素案の作成は本業務の範囲外）</text>
