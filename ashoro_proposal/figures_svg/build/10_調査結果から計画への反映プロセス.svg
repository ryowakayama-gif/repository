<rect class="f-brand" x="271.8" y="144" width="222.8" height="10" rx="8"/>
<text class="f-onbrand fs-13" x="383.20000000000005" y="143" font-weight="700" text-anchor="middle" letter-spacing="0">STEP 2</text>
<text class="f-ink fs-16" x="383.20000000000005" y="186" font-weight="700" text-anchor="middle" letter-spacing="0">課題の抽出</text>
<text class="f-muted fs-11_5" x="383.20000000000005" y="216" font-weight="400" text-anchor="middle" letter-spacing="0">数値の背後にある要因</text>
<text class="f-muted fs-11_5" x="383.20000000000005" y="238" font-weight="400" text-anchor="middle" letter-spacing="0">他調査・統計との照合</text>
<path class="f-brand2" d="M495.6,187.0 L507.6,195 L495.6,203.0 Z"/>
<rect class="f-surface s-brand" x="508.6" y="120" width="222.8" height="150" rx="10" stroke-width="1.6"/>
<rect class="f-brand" x="508.6" y="120" width="222.8" height="34" rx="10"/>
<rect class="f-brand" x="508.6" y="144" width="222.8" height="10" rx="8"/>
