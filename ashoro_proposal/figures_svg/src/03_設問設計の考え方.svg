<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 690" class="bzu-fig" role="img" aria-labelledby="fig-03-t fig-03-d" preserveAspectRatio="xMidYMid meet">
<title id="fig-03-t">設問設計の考え方 ― 計画体系・設問・成果指標の一体設計</title>
<desc id="fig-03-d">「聞きっぱなしにしない」ため、すべての設問を施策体系と成果指標に紐づけて設計します</desc>
<style>
