<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="f-brand2" d="M0,0 L10,5 L0,10 z"/></marker>
<marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="f-accent" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<rect class="f-surface" width="1240" height="690"/>
<rect class="f-surface" x="0" y="0" width="1240" height="0" rx="8"/>
<rect class="f-accent" x="34" y="30" width="5" height="24" rx="2.5"/>
<text class="f-ink fs-23" x="50" y="50" font-weight="700" text-anchor="start" letter-spacing="0.5">設問設計の考え方 ― 計画体系・設問・成果指標の一体設計</text>
<text class="f-muted fs-13_5" x="50" y="74" font-weight="400" text-anchor="start" letter-spacing="0">「聞きっぱなしにしない」ため、すべての設問を施策体系と成果指標に紐づけて設計します</text>
<rect class="f-surface s-brand" x="35" y="120" width="320" height="440" rx="10" stroke-width="1.2"/>
<rect class="f-brand" x="35" y="120" width="320" height="42" rx="10"/>
<rect class="f-brand" x="35" y="150" width="320" height="12" rx="0"/>
<text class="f-onbrand fs-16" x="195" y="148" font-weight="700" text-anchor="middle" letter-spacing="0">Ⅰ. 計画の体系</text>
<rect class="f-brandpale" x="53" y="182" width="284" height="62" rx="7"/>
<text class="f-brand fs-14" x="69" y="208" font-weight="700" text-anchor="start" letter-spacing="0">基本理念</text>
<text class="f-muted fs-12" x="69" y="229" font-weight="400" text-anchor="start" letter-spacing="0">誰もが安心して暮らせるまち</text>
<rect class="f-surfalt" x="53" y="256" width="284" height="62" rx="7"/>
<text class="f-ink fs-14" x="69" y="282" font-weight="700" text-anchor="start" letter-spacing="0">基本目標①</text>
<text class="f-muted fs-12" x="69" y="303" font-weight="400" text-anchor="start" letter-spacing="0">支え合う地域づくり</text>
<rect class="f-surfalt" x="53" y="330" width="284" height="62" rx="7"/>
<text class="f-ink fs-14" x="69" y="356" font-weight="700" text-anchor="start" letter-spacing="0">基本目標②</text>
<text class="f-muted fs-12" x="69" y="377" font-weight="400" text-anchor="start" letter-spacing="0">相談支援体制の充実</text>
<rect class="f-surfalt" x="53" y="404" width="284" height="62" rx="7"/>
<text class="f-ink fs-14" x="69" y="430" font-weight="700" text-anchor="start" letter-spacing="0">基本目標③</text>
<text class="f-muted fs-12" x="69" y="451" font-weight="400" text-anchor="start" letter-spacing="0">権利擁護・安全の確保</text>
<rect class="f-surfalt" x="53" y="478" width="284" height="62" rx="7"/>
<text class="f-ink fs-14" x="69" y="504" font-weight="700" text-anchor="start" letter-spacing="0">施策の柱（12施策）</text>
<text class="f-muted fs-12" x="69" y="525" font-weight="400" text-anchor="start" letter-spacing="0">各目標にぶら下がる具体施策</text>
<path class="f-brand2" d="M365,332.0 L397,340 L365,348.0 Z"/>
<text class="f-brand2 fs-12" x="383" y="320" font-weight="700" text-anchor="middle" letter-spacing="0">対応</text>
<rect class="f-surface s-accent" x="415" y="120" width="400" height="440" rx="10" stroke-width="1.2"/>
<rect class="f-accent" x="415" y="120" width="400" height="42" rx="10"/>
<rect class="f-accent" x="415" y="150" width="400" height="12" rx="0"/>
<text class="f-onaccent fs-16" x="615" y="148" font-weight="700" text-anchor="middle" letter-spacing="0">Ⅱ. 設問の構成</text>
<rect class="f-surfalt" x="433" y="180" width="364" height="52" rx="7"/>
<text class="f-ink fs-13_5" x="449" y="202" font-weight="700" text-anchor="start" letter-spacing="0">① 属性（フェイスシート）</text>
<text class="f-muted fs-11_5" x="449" y="221" font-weight="400" text-anchor="start" letter-spacing="0">年齢・性別・地区・世帯構成・手帳種別/等級</text>
<rect class="f-surfalt" x="433" y="242" width="364" height="52" rx="7"/>
<text class="f-ink fs-13_5" x="449" y="264" font-weight="700" text-anchor="start" letter-spacing="0">② 現状・実態</text>
<text class="f-muted fs-11_5" x="449" y="283" font-weight="400" text-anchor="start" letter-spacing="0">生活状況、困りごと、介助の状況、就労状況</text>
<rect class="f-surfalt" x="433" y="304" width="364" height="52" rx="7"/>
<text class="f-ink fs-13_5" x="449" y="326" font-weight="700" text-anchor="start" letter-spacing="0">③ 認知度・利用状況</text>
<text class="f-muted fs-11_5" x="449" y="345" font-weight="400" text-anchor="start" letter-spacing="0">相談窓口・制度・サービスの認知と利用経験</text>
<rect class="f-surfalt" x="433" y="366" width="364" height="52" rx="7"/>
<text class="f-ink fs-13_5" x="449" y="388" font-weight="700" text-anchor="start" letter-spacing="0">④ 満足度・重要度</text>
<text class="f-muted fs-11_5" x="449" y="407" font-weight="400" text-anchor="start" letter-spacing="0">施策ごとの5段階評価（ポートフォリオ分析用）</text>
<rect class="f-surfalt" x="433" y="428" width="364" height="52" rx="7"/>
<text class="f-ink fs-13_5" x="449" y="450" font-weight="700" text-anchor="start" letter-spacing="0">⑤ 今後の意向・要望</text>
<text class="f-muted fs-11_5" x="449" y="469" font-weight="400" text-anchor="start" letter-spacing="0">望む暮らし方、充実してほしい施策（複数回答）</text>
<rect class="f-surfalt" x="433" y="490" width="364" height="52" rx="7"/>
<text class="f-ink fs-13_5" x="449" y="512" font-weight="700" text-anchor="start" letter-spacing="0">⑥ 自由記述</text>
<text class="f-muted fs-11_5" x="449" y="531" font-weight="400" text-anchor="start" letter-spacing="0">施策への意見・要望（1〜2問に限定）</text>
<path class="f-accent" d="M825,332.0 L857,340 L825,348.0 Z"/>
<text class="f-accent fs-12" x="843" y="320" font-weight="700" text-anchor="middle" letter-spacing="0">設定</text>
<rect class="f-surface s-brand2" x="875" y="120" width="330" height="440" rx="10" stroke-width="1.2"/>
<rect class="f-brand2" x="875" y="120" width="330" height="42" rx="10"/>
<rect class="f-brand2" x="875" y="150" width="330" height="12" rx="0"/>
<text class="f-onbrand fs-16" x="1040" y="148" font-weight="700" text-anchor="middle" letter-spacing="0">Ⅲ. 成果指標（KPI）</text>
<rect class="f-surfalt" x="893" y="182" width="294" height="62" rx="7"/>
<text class="f-ink fs-13" x="909" y="208" font-weight="700" text-anchor="start" letter-spacing="0">地域活動・ボランティア参加率</text>
<text class="f-accent fs-12" x="909" y="229" font-weight="700" text-anchor="start" letter-spacing="0">前回 38.4% → 目標 45%</text>
<rect class="f-surfalt" x="893" y="256" width="294" height="62" rx="7"/>
<text class="f-ink fs-13" x="909" y="282" font-weight="700" text-anchor="start" letter-spacing="0">社会福祉協議会の認知度</text>
<text class="f-accent fs-12" x="909" y="303" font-weight="700" text-anchor="start" letter-spacing="0">前回 47.8% → 目標 60%</text>
<rect class="f-surfalt" x="893" y="330" width="294" height="62" rx="7"/>
<text class="f-ink fs-13" x="909" y="356" font-weight="700" text-anchor="start" letter-spacing="0">不快な思いをした経験がある割合</text>
<text class="f-accent fs-12" x="909" y="377" font-weight="700" text-anchor="start" letter-spacing="0">前回 22.2% → 目標 15%以下</text>
<rect class="f-surfalt" x="893" y="404" width="294" height="62" rx="7"/>
<text class="f-ink fs-13" x="909" y="430" font-weight="700" text-anchor="start" letter-spacing="0">成年後見制度の認知度</text>
<text class="f-accent fs-12" x="909" y="451" font-weight="700" text-anchor="start" letter-spacing="0">前回 21.4% → 目標 30%</text>
<rect class="f-surfalt" x="893" y="478" width="294" height="62" rx="7"/>
<text class="f-ink fs-13" x="909" y="504" font-weight="700" text-anchor="start" letter-spacing="0">足寄町を暮らしやすいと思う割合</text>
<text class="f-accent fs-12" x="909" y="525" font-weight="700" text-anchor="start" letter-spacing="0">前回 63.8% → 維持・向上</text>
<rect class="f-brandpale" x="35" y="588" width="1170" height="78" rx="10"/>
<text class="f-brand fs-15" x="57" y="616" font-weight="700" text-anchor="start" letter-spacing="0">継続設問と新規設問のバランス</text>
<text class="f-ink fs-12_5" x="57" y="642" font-weight="400" text-anchor="start" letter-spacing="0">経年比較が必要な設問は選択肢まで含めて前回調査を踏襲（概ね7割）。残る3割で新たな政策課題（ヤングケアラー・8050問題・意思決定支援・災害時の避難支援 等）を把握します。</text>
</svg>
