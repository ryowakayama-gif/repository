<rect class="f-surface" width="1240" height="730"/>
<rect class="f-accent" x="34" y="30" width="5" height="24" rx="2.5"/>
<text class="f-ink fs-23" x="50" y="50" font-weight="700" text-anchor="start" letter-spacing="0.5">二段階ウェイトバック集計の設計</text>
<text class="f-muted fs-13_5" x="50" y="74" font-weight="400" text-anchor="start" letter-spacing="0">抽出率の違いと回収率の違いを分けて補正し、大誉地・芽登・螺湾の各地区でも意味のある分析を可能にします</text>
<rect class="f-surface s-border" x="35" y="112" width="560" height="268" rx="9" stroke-width="1.2"/>
<rect class="f-brand" x="35" y="112" width="560" height="38" rx="9"/>
<rect class="f-brand" x="35" y="140" width="560" height="10"/>
<text class="f-onbrand fs-15" x="53" y="137" font-weight="700" text-anchor="start" letter-spacing="0">（a）抽出ウェイト ― 地区ごとの抽出率の逆数</text>
<rect class="f-brandpale" x="53" y="162" width="524" height="26" rx="4"/>
<text class="f-brand fs-11_5" x="60" y="180" font-weight="700" text-anchor="start" letter-spacing="0">地区</text>
<text class="f-brand fs-11_5" x="300" y="180" font-weight="700" text-anchor="middle" letter-spacing="0">18歳以上人口</text>
<text class="f-brand fs-11_5" x="400" y="180" font-weight="700" text-anchor="middle" letter-spacing="0">配布数</text>
<text class="f-brand fs-11_5" x="480" y="180" font-weight="700" text-anchor="middle" letter-spacing="0">回収見込</text>
<text class="f-brand fs-11_5" x="565" y="180" font-weight="700" text-anchor="end" letter-spacing="0">ウェイト</text>
<text class="f-ink fs-11_5" x="60" y="207" font-weight="400" text-anchor="start" letter-spacing="0">足寄小学校区</text>
<text class="f-ink fs-11_5" x="300" y="207" font-weight="400" text-anchor="middle" letter-spacing="0">約4,300人</text>
<text class="f-ink fs-11_5" x="400" y="207" font-weight="400" text-anchor="middle" letter-spacing="0">1,400票</text>
<text class="f-ink fs-11_5" x="480" y="207" font-weight="400" text-anchor="middle" letter-spacing="0">630票</text>
<text class="f-ink fs-11_5" x="565" y="207" font-weight="700" text-anchor="end" letter-spacing="0">3.07</text>
<rect class="f-surfalt" x="53" y="216" width="524" height="28"/>
<text class="f-ink fs-11_5" x="60" y="235" font-weight="400" text-anchor="start" letter-spacing="0">大誉地小学校区</text>
<text class="f-ink fs-11_5" x="300" y="235" font-weight="400" text-anchor="middle" letter-spacing="0">約400人</text>
<text class="f-ink fs-11_5" x="400" y="235" font-weight="400" text-anchor="middle" letter-spacing="0">200票</text>
<text class="f-ink fs-11_5" x="480" y="235" font-weight="400" text-anchor="middle" letter-spacing="0">90票</text>
<text class="f-ink fs-11_5" x="565" y="235" font-weight="700" text-anchor="end" letter-spacing="0">2.00</text>
<text class="f-ink fs-11_5" x="60" y="263" font-weight="400" text-anchor="start" letter-spacing="0">芽登小学校区</text>
<text class="f-ink fs-11_5" x="300" y="263" font-weight="400" text-anchor="middle" letter-spacing="0">約400人</text>
<text class="f-ink fs-11_5" x="400" y="263" font-weight="400" text-anchor="middle" letter-spacing="0">200票</text>
<text class="f-ink fs-11_5" x="480" y="263" font-weight="400" text-anchor="middle" letter-spacing="0">90票</text>
<text class="f-ink fs-11_5" x="565" y="263" font-weight="700" text-anchor="end" letter-spacing="0">2.00</text>
<rect class="f-surfalt" x="53" y="272" width="524" height="28"/>
<text class="f-ink fs-11_5" x="60" y="291" font-weight="400" text-anchor="start" letter-spacing="0">螺湾小学校区</text>
<text class="f-ink fs-11_5" x="300" y="291" font-weight="400" text-anchor="middle" letter-spacing="0">約400人</text>
<text class="f-ink fs-11_5" x="400" y="291" font-weight="400" text-anchor="middle" letter-spacing="0">200票</text>
<text class="f-ink fs-11_5" x="480" y="291" font-weight="400" text-anchor="middle" letter-spacing="0">90票</text>
<text class="f-ink fs-11_5" x="565" y="291" font-weight="700" text-anchor="end" letter-spacing="0">2.00</text>
<rect class="f-brandpale" x="53" y="300" width="524" height="28"/>
<text class="f-ink fs-11_5" x="60" y="319" font-weight="700" text-anchor="start" letter-spacing="0">計</text>
<text class="f-ink fs-11_5" x="300" y="319" font-weight="700" text-anchor="middle" letter-spacing="0">約5,500人</text>
<text class="f-ink fs-11_5" x="400" y="319" font-weight="700" text-anchor="middle" letter-spacing="0">2,000票</text>
<text class="f-ink fs-11_5" x="480" y="319" font-weight="700" text-anchor="middle" letter-spacing="0">900票</text>
<text class="f-ink fs-11_5" x="565" y="319" font-weight="700" text-anchor="end" letter-spacing="0">―</text>
<text class="f-muted fs-10_5" x="60" y="352" font-weight="400" text-anchor="start" letter-spacing="0">※ 回収率45%を前提とした試算です。地区別人口は町からご提供いただくデータで確定します。</text>
<text class="f-muted fs-10_5" x="60" y="370" font-weight="400" text-anchor="start" letter-spacing="0">※ 足寄小学校区の回答者1人と螺湾小学校区の回答者1人が代表する人数を揃えます。</text>
<rect class="f-surface s-border" x="645" y="112" width="560" height="268" rx="9" stroke-width="1.2"/>
<rect class="f-brand2" x="645" y="112" width="560" height="38" rx="9"/>
<rect class="f-brand2" x="645" y="140" width="560" height="10"/>
<text class="f-onbrand fs-15" x="663" y="137" font-weight="700" text-anchor="start" letter-spacing="0">（b）無回答調整ウェイト ― 性・年齢階級別の回収率差を補正</text>
<text class="f-ink fs-11_5" x="668" y="200" font-weight="700" text-anchor="start" letter-spacing="0">男性</text>
<text class="f-ink fs-11_5" x="668" y="240" font-weight="700" text-anchor="start" letter-spacing="0">女性</text>
<text class="f-brand fs-11" x="756.0" y="166" font-weight="700" text-anchor="middle" letter-spacing="0">18〜39歳</text>
<text class="f-brand fs-11" x="868.0" y="166" font-weight="700" text-anchor="middle" letter-spacing="0">40〜64歳</text>
<text class="f-brand fs-11" x="980.0" y="166" font-weight="700" text-anchor="middle" letter-spacing="0">65〜74歳</text>
<text class="f-brand fs-11" x="1092.0" y="166" font-weight="700" text-anchor="middle" letter-spacing="0">75歳以上</text>
<rect class="f-surfalt s-border" x="700" y="174" width="108" height="36" rx="4" stroke-width="1"/>
<text class="f-ink fs-13" x="754.0" y="200" font-weight="700" text-anchor="middle" letter-spacing="0">1.42</text>
<rect class="f-surfalt s-border" x="812" y="174" width="108" height="36" rx="4" stroke-width="1"/>
<text class="f-ink fs-13" x="866.0" y="200" font-weight="700" text-anchor="middle" letter-spacing="0">1.18</text>
<rect class="f-surfalt s-border" x="924" y="174" width="108" height="36" rx="4" stroke-width="1"/>
<text class="f-ink fs-13" x="978.0" y="200" font-weight="700" text-anchor="middle" letter-spacing="0">0.86</text>
<rect class="f-surfalt s-border" x="1036" y="174" width="108" height="36" rx="4" stroke-width="1"/>
<text class="f-ink fs-13" x="1090.0" y="200" font-weight="700" text-anchor="middle" letter-spacing="0">0.74</text>
<rect class="f-surfalt s-border" x="700" y="214" width="108" height="36" rx="4" stroke-width="1"/>
<text class="f-ink fs-13" x="754.0" y="240" font-weight="700" text-anchor="middle" letter-spacing="0">1.31</text>
<rect class="f-surfalt s-border" x="812" y="214" width="108" height="36" rx="4" stroke-width="1"/>
<text class="f-ink fs-13" x="866.0" y="240" font-weight="700" text-anchor="middle" letter-spacing="0">1.09</text>
<rect class="f-surfalt s-border" x="924" y="214" width="108" height="36" rx="4" stroke-width="1"/>
<text class="f-ink fs-13" x="978.0" y="240" font-weight="700" text-anchor="middle" letter-spacing="0">0.83</text>
<rect class="f-surfalt s-border" x="1036" y="214" width="108" height="36" rx="4" stroke-width="1"/>
<text class="f-ink fs-13" x="1090.0" y="240" font-weight="700" text-anchor="middle" letter-spacing="0">0.71</text>
<text class="f-muted fs-10_5" x="668" y="290" font-weight="400" text-anchor="start" letter-spacing="0">（数値は算出イメージ。1.00より大きい＝回収率が低く重みを増す層）</text>
<rect class="f-surfalt" x="668" y="302" width="514" height="62" rx="6"/>
<text class="f-ink fs-11_5" x="684" y="322" font-weight="400" text-anchor="start" letter-spacing="0">住民基本台帳の性・年齢別人口を基準に、地区×性×年齢階級のセルごとに</text>
<text class="f-ink fs-11_5" x="684" y="342" font-weight="400" text-anchor="start" letter-spacing="0">「母集団構成比 ÷ 回答者構成比」で重みを算出します。</text>
<text class="f-accent fs-23" x="620" y="258" font-weight="700" text-anchor="middle" letter-spacing="0">×</text>
<path class="s-accent" d="M620,392 L620,404" stroke-width="2" fill="none"/>
<rect class="f-accentpale s-accent" x="35" y="408" width="1170" height="96" rx="10" stroke-width="1.4"/>
<text class="f-ink fs-17" x="57" y="438" font-weight="700" text-anchor="start" letter-spacing="0">最終ウェイト ＝ （a）抽出ウェイト × （b）無回答調整ウェイト</text>
<text class="f-ink fs-12_5" x="57" y="464" font-weight="400" text-anchor="start" letter-spacing="0">地区 × 性 × 年齢階級のセル単位で設計します。</text>
<text class="f-ink fs-12" x="57" y="488" font-weight="400" text-anchor="start" letter-spacing="0">本設計での実効標本数は約872（デザイン効果1.03）。ウェイト値2は運用上の目安とし、隣接層との統合・トリミングの要否は、実効標本数や補正前後の推定値の変化を確認したうえで判断します。</text>
<rect class="f-surfalt s-border" x="35" y="520" width="560" height="74" rx="8" stroke-width="1.2"/>
<text class="f-brand fs-13" x="57" y="546" font-weight="700" text-anchor="start" letter-spacing="0">層化配分とウェイト集計は役割が違います</text>
<text class="f-ink fs-11_5" x="57" y="568" font-weight="400" text-anchor="start" letter-spacing="0">小地区の誤差縮小は（２）の層化配分＝回収数の確保が担い、</text>
<text class="f-ink fs-11_5" x="57" y="586" font-weight="400" text-anchor="start" letter-spacing="0">ウェイト集計はその上で地区間・属性間の代表性を整えます。</text>
<rect class="f-surfalt s-border" x="645" y="520" width="560" height="74" rx="8" stroke-width="1.2"/>
<text class="f-brand fs-13" x="667" y="546" font-weight="700" text-anchor="start" letter-spacing="0">障がい者アンケートへの適用</text>
<text class="f-ink fs-11_5" x="667" y="568" font-weight="400" text-anchor="start" letter-spacing="0">実人数が500人を下回る場合は抽出ウェイトは不要ですが、</text>
<text class="f-ink fs-11_5" x="667" y="586" font-weight="400" text-anchor="start" letter-spacing="0">手帳種別による無回答調整ウェイトは有効です（前回：療育26.8%〜自立支援医療69.6%）。</text>
<rect class="f-brandpale" x="35" y="610" width="1170" height="100" rx="10"/>
<text class="f-brand fs-15" x="57" y="636" font-weight="700" text-anchor="start" letter-spacing="0">報告書に必ず明記する事項</text>
<text class="f-ink fs-12" x="57" y="660" font-weight="400" text-anchor="start" letter-spacing="0">・ウェイトの定義・算出方法と、補正に用いた基準統計</text>
<text class="f-ink fs-12" x="637" y="660" font-weight="400" text-anchor="start" letter-spacing="0">・主要設問は単純集計値とウェイトバック後集計値の両方を併記</text>
<text class="f-ink fs-12" x="57" y="682" font-weight="400" text-anchor="start" letter-spacing="0">・標本誤差早見表・95%信頼区間・実効標本数</text>
<text class="f-ink fs-12" x="637" y="682" font-weight="400" text-anchor="start" letter-spacing="0">・有意差判定基準（統計的に有意といえない差を地域特性・年代特性として断定しない編集基準）</text>

</svg>
