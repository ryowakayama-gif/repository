<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 730" class="bzu-fig" role="img" aria-labelledby="fig-12-t fig-12-d" preserveAspectRatio="xMidYMid meet">
<title id="fig-12-t">二段階ウェイトバック集計の設計</title>
<desc id="fig-12-d">抽出率の違いと回収率の違いを分けて補正し、大誉地・芽登・螺湾の各地区でも意味のある分析を可能にします</desc>
