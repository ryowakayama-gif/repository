<rect class="f-surface" width="1240" height="700"/>
<rect class="f-accent" x="34" y="30" width="5" height="24" rx="2.5"/>
<text class="f-ink fs-23" x="50" y="50" font-weight="700" text-anchor="start" letter-spacing="0.5">ウェイト補正の効果と、回答数が少ないセルの取扱い</text>
<text class="f-muted fs-13_5" x="50" y="74" font-weight="400" text-anchor="start" letter-spacing="0">前回調査データを用いた当社の試算。補正の影響は設問ごとに異なり、少数セルの差は統計的に有意とは限りません</text>
<rect class="f-surface s-border" x="35" y="112" width="690" height="300" rx="9" stroke-width="1.2"/>
<rect class="f-brand" x="35" y="112" width="690" height="38" rx="9"/>
<rect class="f-brand" x="35" y="140" width="690" height="10"/>
<text class="f-onbrand fs-15" x="53" y="137" font-weight="700" text-anchor="start" letter-spacing="0">補正前後の比較 ― 前回調査データを用いた当社試算</text>
<text class="f-brand fs-11_5" x="55" y="178" font-weight="700" text-anchor="start" letter-spacing="0">報告書の値</text>
<rect class="f-brand" x="150" y="169" width="26" height="11" rx="2"/>
<text class="f-accent fs-11_5" x="200" y="178" font-weight="700" text-anchor="start" letter-spacing="0">人口構成比で補正した推計値</text>
<rect class="f-accent" x="390" y="169" width="26" height="11" rx="2"/>
<text class="f-ink fs-12" x="55" y="214" font-weight="700" text-anchor="start" letter-spacing="0">民生委員・児童委員を知っている</text>
<rect class="f-brand" x="300" y="222" width="226.9" height="18" rx="3"/>
<text class="f-brand fs-11_5" x="534.9" y="236" font-weight="700" text-anchor="start" letter-spacing="0">59.7%</text>
<rect class="f-accent" x="300" y="244" width="213.2" height="18" rx="3"/>
<text class="f-accent fs-11_5" x="521.2" y="258" font-weight="700" text-anchor="start" letter-spacing="0">56.1%</text>
<text class="f-ink fs-13" x="700" y="214" font-weight="700" text-anchor="end" letter-spacing="0">−3.6pt</text>
<text class="f-ink fs-12" x="55" y="282" font-weight="700" text-anchor="start" letter-spacing="0">暮らしやすいと思う</text>
<rect class="f-brand" x="300" y="290" width="242.4" height="18" rx="3"/>
<text class="f-brand fs-11_5" x="550.4" y="304" font-weight="700" text-anchor="start" letter-spacing="0">63.8%</text>
<rect class="f-accent" x="300" y="312" width="239.8" height="18" rx="3"/>
<text class="f-accent fs-11_5" x="547.8" y="326" font-weight="700" text-anchor="start" letter-spacing="0">63.1%</text>
<text class="f-ink fs-13" x="700" y="282" font-weight="700" text-anchor="end" letter-spacing="0">−0.7pt</text>
<text class="f-ink fs-12" x="55" y="350" font-weight="700" text-anchor="start" letter-spacing="0">避難場所を知らない</text>
<rect class="f-brand" x="300" y="358" width="35.7" height="18" rx="3"/>
<text class="f-brand fs-11_5" x="343.7" y="372" font-weight="700" text-anchor="start" letter-spacing="0">9.4%</text>
<rect class="f-accent" x="300" y="380" width="37.6" height="18" rx="3"/>
<text class="f-accent fs-11_5" x="345.6" y="394" font-weight="700" text-anchor="start" letter-spacing="0">9.9%</text>
<text class="f-ink fs-13" x="700" y="350" font-weight="700" text-anchor="end" letter-spacing="0">＋0.5pt</text>
<line class="s-border" x1="300" y1="196" x2="300" y2="392" stroke-width="1"/>
<text class="f-muted fs-10_5" x="55" y="404" font-weight="400" text-anchor="start" letter-spacing="0">※ 回答者の70歳以上は44.1%、18歳以上人口では約35%。この9ポイントの差を補正した試算です。</text>
<rect class="f-surface s-border" x="755" y="112" width="450" height="300" rx="9" stroke-width="1.2"/>
<rect class="f-accent" x="755" y="112" width="450" height="38" rx="9"/>
<rect class="f-accent" x="755" y="140" width="450" height="10"/>
<text class="f-onaccent fs-15" x="773" y="137" font-weight="700" text-anchor="start" letter-spacing="0">回答数が少ないセルの95%信頼区間</text>
<text class="f-ink fs-11_5" x="775" y="168" font-weight="700" text-anchor="start" letter-spacing="0">螺湾小学校区「暮らしやすい」</text>
<text class="f-muted fs-11" x="1190" y="168" font-weight="400" text-anchor="end" letter-spacing="0">n=35</text>
<line class="s-brand2" x1="1011.3" y1="194" x2="1118.6" y2="194" stroke-width="3"/>
<line class="s-brand2" x1="1011.3" y1="187" x2="1011.3" y2="201" stroke-width="2.4"/>
<line class="s-brand2" x1="1118.6" y1="187" x2="1118.6" y2="201" stroke-width="2.4"/>
<circle class="f-accent" cx="1064.9" cy="194" r="5.5"/>
<text class="f-ink fs-10_5" x="1064.9" y="218" font-weight="400" text-anchor="middle" letter-spacing="0">74.3%（60〜89%）</text>
<text class="f-ink fs-11_5" x="775" y="236" font-weight="700" text-anchor="start" letter-spacing="0">全体「暮らしやすい」</text>
<text class="f-muted fs-11" x="1190" y="236" font-weight="400" text-anchor="end" letter-spacing="0">n=766</text>
<line class="s-brand2" x1="1013.5" y1="262" x2="1038.6" y2="262" stroke-width="3"/>
<line class="s-brand2" x1="1013.5" y1="255" x2="1013.5" y2="269" stroke-width="2.4"/>
<line class="s-brand2" x1="1038.6" y1="255" x2="1038.6" y2="269" stroke-width="2.4"/>
<circle class="f-accent" cx="1026.1" cy="262" r="5.5"/>
<text class="f-ink fs-10_5" x="1026.1" y="286" font-weight="400" text-anchor="middle" letter-spacing="0">63.8%（60〜67%）</text>
<text class="f-ink fs-11_5" x="775" y="304" font-weight="700" text-anchor="start" letter-spacing="0">30歳代 民生委員の認知度</text>
<text class="f-muted fs-11" x="1190" y="304" font-weight="400" text-anchor="end" letter-spacing="0">n=39</text>
<line class="s-brand2" x1="818.9" y1="330" x2="912.8" y2="330" stroke-width="3"/>
<line class="s-brand2" x1="818.9" y1="323" x2="818.9" y2="337" stroke-width="2.4"/>
<line class="s-brand2" x1="912.8" y1="323" x2="912.8" y2="337" stroke-width="2.4"/>
<circle class="f-accent" cx="865.9" cy="330" r="5.5"/>
<text class="f-ink fs-10_5" x="865.9" y="354" font-weight="400" text-anchor="middle" letter-spacing="0">20.5%（8〜33%）</text>
<rect class="f-accentpale" x="775" y="366" width="415" height="40" rx="5"/>
<text class="f-ink fs-11" x="788" y="382" font-weight="400" text-anchor="start" letter-spacing="0">螺湾（59.8〜88.8%）と全体（60.4〜67.2%）は区間が重なるため、</text>
<text class="f-ink fs-11" x="788" y="398" font-weight="400" text-anchor="start" letter-spacing="0">10.5ポイントの差は統計的に有意とはいえません。</text>
<rect class="f-surfalt s-border" x="35" y="434" width="380" height="130" rx="9" stroke-width="1.2"/>
<rect class="f-accent" x="35" y="434" width="380" height="5" rx="2"/>
<text class="f-brand fs-13" x="53" y="464" font-weight="700" text-anchor="start" letter-spacing="0">1. 補正の影響は設問ごとに異なります</text>
<text class="f-ink fs-11_5" x="53" y="492" font-weight="400" text-anchor="start" letter-spacing="0">年代による回答の開きが大きい設問ほど</text>
<text class="f-ink fs-11_5" x="53" y="512" font-weight="400" text-anchor="start" letter-spacing="0">影響が大きくなります。民生委員の認知度は</text>
<text class="f-ink fs-11_5" x="53" y="532" font-weight="400" text-anchor="start" letter-spacing="0">70歳以上77.1%・70歳未満44.8%で32ptの差。</text>
<rect class="f-surfalt s-border" x="428" y="434" width="380" height="130" rx="9" stroke-width="1.2"/>
<rect class="f-accent" x="428" y="434" width="380" height="5" rx="2"/>
<text class="f-brand fs-13" x="446" y="464" font-weight="700" text-anchor="start" letter-spacing="0">2. 数値が上がる設問もあります</text>
<text class="f-ink fs-11_5" x="446" y="492" font-weight="400" text-anchor="start" letter-spacing="0">「避難場所を知らない」は補正で9.4→9.9%。</text>
<text class="f-ink fs-11_5" x="446" y="512" font-weight="400" text-anchor="start" letter-spacing="0">報告書の値が実態より良く見えていた設問を</text>
<text class="f-ink fs-11_5" x="446" y="532" font-weight="400" text-anchor="start" letter-spacing="0">見落とさない設計とします。</text>
<rect class="f-surfalt s-border" x="821" y="434" width="380" height="130" rx="9" stroke-width="1.2"/>
<rect class="f-accent" x="821" y="434" width="380" height="5" rx="2"/>
<text class="f-brand fs-13" x="839" y="464" font-weight="700" text-anchor="start" letter-spacing="0">3. 報告書では補正前後の両方を示します</text>
<text class="f-ink fs-11_5" x="839" y="492" font-weight="400" text-anchor="start" letter-spacing="0">ウェイト集計を一律に「数値が大きく変わる</text>
<text class="f-ink fs-11_5" x="839" y="512" font-weight="400" text-anchor="start" letter-spacing="0">手法」として扱わず、設問ごとに補正前後を</text>
<text class="f-ink fs-11_5" x="839" y="532" font-weight="400" text-anchor="start" letter-spacing="0">確認し、差が生じた設問を明示します。</text>
<rect class="f-brandpale" x="35" y="582" width="1170" height="84" rx="10"/>
<text class="f-brand fs-15" x="57" y="608" font-weight="700" text-anchor="start" letter-spacing="0">本試算の前提と、契約後の精緻化</text>
<text class="f-ink fs-12" x="57" y="632" font-weight="400" text-anchor="start" letter-spacing="0">※ 10歳刻みの人口統計を入手できていないため、70歳以上／70歳未満の2区分による概算です。契約後に町からご提供いただく住民基本台帳の</text>
<text class="f-ink fs-12" x="57" y="654" font-weight="400" text-anchor="start" letter-spacing="0">　 性・年齢別人口を用い、図版12の二段階ウェイトバック設計により精緻化します。前回報告書の数値そのものを否定するものではありません。</text>

</svg>
