<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 700" class="bzu-fig" role="img" aria-labelledby="fig-14-t fig-14-d" preserveAspectRatio="xMidYMid meet">
<title id="fig-14-t">ウェイト補正の効果と、回答数が少ないセルの取扱い</title>
<desc id="fig-14-d">前回調査データを用いた当社の試算。補正の影響は設問ごとに異なり、少数セルの差は統計的に有意とは限りません</desc>
<style>
