<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 640" class="bzu-fig" role="img" aria-labelledby="fig-05-t fig-05-d" preserveAspectRatio="xMidYMid meet">
<title id="fig-05-t">郵送・Web併用（ハイブリッド）調査の流れ</title>
<desc id="fig-05-d">回答者の負担軽減と、集計工数・誤入力の削減を同時に実現します（仕様書上は郵送法。Web併用は費用対効果を協議のうえでの追加提案です）</desc>
<style>
/* ==== 可変トークン ====
   外側の CSS で :root や任意の親要素に
   --c-brand などを定義すれば、この図の配色を一括変更できます。
   例) :root{ --c-brand:#004C6D; --fs-scale:1.08; }
   ==================== */
.bzu-fig{
  display:block; width:100%;
  max-width:var(--fig-max-width, 1240px);
  height:auto; margin:var(--fig-margin, 0 auto);
  font-family:var(--fig-font, 'Yu Gothic UI','Yu Gothic','Meiryo','Noto Sans CJK JP','Hiragino Kaku Gothic ProN',sans-serif);
  font-weight:var(--fig-font-weight, 400);
}
.bzu-fig .f-ink{fill:var(--c-ink,#1A2B3C)}
.bzu-fig .f-muted{fill:var(--c-ink-muted,#5E7182)}
.bzu-fig .f-brand{fill:var(--c-brand,#1E5F74)}
.bzu-fig .f-brand2{fill:var(--c-brand-light,#3E8296)}
.bzu-fig .f-accent{fill:var(--c-accent,#E07B39)}
.bzu-fig .f-surfalt{fill:var(--c-surface-alt,#F4F7F8)}
.bzu-fig .f-brandpale{fill:var(--c-brand-pale,#E2EDF0)}
.bzu-fig .f-surface{fill:var(--c-surface,#FFFFFF)}
.bzu-fig .f-onbrand{fill:var(--c-on-brand,#FFFFFF)}
.bzu-fig .f-onaccent{fill:var(--c-on-accent,#FFFFFF)}
.bzu-fig .s-brand{stroke:var(--c-brand,#1E5F74)}
.bzu-fig .s-brand2{stroke:var(--c-brand-light,#3E8296)}
.bzu-fig .s-accent{stroke:var(--c-accent,#E07B39)}
.bzu-fig .s-border{stroke:var(--c-border,#C7D5DC)}
/* 文字サイズ：--fs-scale で全体を一括拡縮（既定 1） */
.bzu-fig .fs-11_5{font-size:calc(11.5px * var(--fs-scale, 1))}
.bzu-fig .fs-12{font-size:calc(12px * var(--fs-scale, 1))}
.bzu-fig .fs-13{font-size:calc(13px * var(--fs-scale, 1))}
.bzu-fig .fs-13_5{font-size:calc(13.5px * var(--fs-scale, 1))}
.bzu-fig .fs-14{font-size:calc(14px * var(--fs-scale, 1))}
.bzu-fig .fs-14_5{font-size:calc(14.5px * var(--fs-scale, 1))}
.bzu-fig .fs-15{font-size:calc(15px * var(--fs-scale, 1))}
.bzu-fig .fs-16{font-size:calc(16px * var(--fs-scale, 1))}
.bzu-fig .fs-23{font-size:calc(23px * var(--fs-scale, 1))}
</style>

<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="f-brand2" d="M0,0 L10,5 L0,10 z"/></marker>
<marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="f-accent" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<rect class="f-surface" width="1240" height="640"/>
<rect class="f-surface" x="0" y="0" width="1240" height="0" rx="8"/>
<rect class="f-accent" x="34" y="30" width="5" height="24" rx="2.5"/>
<text class="f-ink fs-23" x="50" y="50" font-weight="700" text-anchor="start" letter-spacing="0.5">郵送・Web併用（ハイブリッド）調査の流れ</text>
<text class="f-muted fs-13_5" x="50" y="74" font-weight="400" text-anchor="start" letter-spacing="0">回答者の負担軽減と、集計工数・誤入力の削減を同時に実現します（仕様書上は郵送法。Web併用は費用対効果を協議のうえでの追加提案です）</text>
<rect class="f-brand" x="45" y="150" width="230" height="90" rx="10"/>
<text class="f-onbrand fs-15" x="160" y="186" font-weight="700" text-anchor="middle" letter-spacing="0">① 対象者の抽出（町）</text>
<text class="f-onbrand fs-12" x="160" y="210" font-weight="400" text-anchor="middle" letter-spacing="0">住民基本台帳・手帳台帳から</text>
<text class="f-onbrand fs-12" x="160" y="228" font-weight="400" text-anchor="middle" letter-spacing="0">委託者（町）が層化抽出</text>
<path class="f-brand2" d="M285,187.0 L315,195 L285,203.0 Z"/>
<rect class="f-brand" x="325" y="150" width="250" height="90" rx="10"/>
<text class="f-onbrand fs-15" x="450" y="186" font-weight="700" text-anchor="middle" letter-spacing="0">② 調査票の発送（町）</text>
<text class="f-onbrand fs-12" x="450" y="210" font-weight="400" text-anchor="middle" letter-spacing="0">受託者が印刷した調査票＋</text>
<text class="f-onbrand fs-12" x="450" y="228" font-weight="400" text-anchor="middle" letter-spacing="0">QRコード・個別回答ID</text>
<path class="s-brand2" d="M575,195 L620,195 L620,320" fill="none" stroke-width="1.8"/>
<path class="s-brand2" d="M620,320 L620,430" fill="none" stroke-width="1.8"/>
<path class="s-brand2" d="M620,320 L665,320" fill="none" stroke-width="1.8" marker-end="url(#ar)"/>
<path class="s-brand2" d="M620,430 L665,430" fill="none" stroke-width="1.8" marker-end="url(#ar)"/>
<rect class="f-surface s-brand" x="675" y="285" width="300" height="72" rx="10" stroke-width="1.2"/>
<rect class="f-brand" x="693" y="300" width="74" height="24" rx="12.0"/>
<text class="f-onbrand fs-12" x="730.0" y="316.32" font-weight="700" text-anchor="middle" letter-spacing="0">郵送</text>
<text class="f-ink fs-14" x="785" y="318" font-weight="700" text-anchor="start" letter-spacing="0">調査票に記入し返送</text>
<text class="f-muted fs-11_5" x="693" y="344" font-weight="400" text-anchor="start" letter-spacing="0">料金受取人払封筒／筆記が困難な方は代筆可</text>
<rect class="f-surface s-accent" x="675" y="395" width="300" height="72" rx="10" stroke-width="1.2"/>
<rect class="f-accent" x="693" y="410" width="74" height="24" rx="12.0"/>
<text class="f-onaccent fs-12" x="730.0" y="426.32" font-weight="700" text-anchor="middle" letter-spacing="0">Web</text>
<text class="f-ink fs-14" x="785" y="428" font-weight="700" text-anchor="start" letter-spacing="0">QRからスマホで回答</text>
<text class="f-muted fs-11_5" x="693" y="454" font-weight="400" text-anchor="start" letter-spacing="0">画面読み上げ対応／24時間受付／再開機能あり</text>
<path class="s-brand2" d="M975,321 L1015,321 L1015,360" fill="none" stroke-width="1.8"/>
<path class="s-accent" d="M975,431 L1015,431 L1015,392" fill="none" stroke-width="1.8"/>
<rect class="f-brandpale" x="1010" y="358" width="190" height="76" rx="10"/>
<text class="f-brand fs-14_5" x="1105" y="386" font-weight="700" text-anchor="middle" letter-spacing="0">③ データ統合</text>
<text class="f-ink fs-12" x="1105" y="408" font-weight="400" text-anchor="middle" letter-spacing="0">回答IDで名寄せ・</text>
<text class="f-ink fs-12" x="1105" y="426" font-weight="400" text-anchor="middle" letter-spacing="0">重複回答をチェック</text>
<rect class="f-surfalt s-border" x="45" y="500" width="1150" height="108" rx="10" stroke-width="1.2"/>
<text class="f-ink fs-16" x="69" y="530" font-weight="700" text-anchor="start" letter-spacing="0">Web併用による効果</text>
<rect class="f-accent" x="69" y="552" width="4" height="36" rx="2"/>
<text class="f-brand fs-13" x="83" y="568" font-weight="700" text-anchor="start" letter-spacing="0">入力工数</text>
<text class="f-muted fs-11_5" x="83" y="588" font-weight="400" text-anchor="start" letter-spacing="0">紙の入力・点検作業を約4割削減</text>
<rect class="f-accent" x="357" y="552" width="4" height="36" rx="2"/>
<text class="f-brand fs-13" x="371" y="568" font-weight="700" text-anchor="start" letter-spacing="0">誤入力・無効回答</text>
<text class="f-muted fs-11_5" x="371" y="588" font-weight="400" text-anchor="start" letter-spacing="0">必須項目・論理チェックで大幅減</text>
<rect class="f-accent" x="645" y="552" width="4" height="36" rx="2"/>
<text class="f-brand fs-13" x="659" y="568" font-weight="700" text-anchor="start" letter-spacing="0">進捗把握</text>
<text class="f-muted fs-11_5" x="659" y="588" font-weight="400" text-anchor="start" letter-spacing="0">回収状況を日次でダッシュボード共有</text>
<rect class="f-accent" x="933" y="552" width="4" height="36" rx="2"/>
<text class="f-brand fs-13" x="947" y="568" font-weight="700" text-anchor="start" letter-spacing="0">自由記述</text>
<text class="f-muted fs-11_5" x="947" y="588" font-weight="400" text-anchor="start" letter-spacing="0">テキスト化不要でそのまま分析可能</text>
</svg>
