function renderRequests(){const first=REQUESTS.filter(r=>['一次登録まで','一次・最終共通'].includes(r.phase)).length,final=REQUESTS.filter(r=>['計画確定まで','一次・最終共通'].includes(r.phase)).length;return `${pageHead('二段階の必要資料・入力台帳','一次登録までと計画確定・保険料算定までを分け、担当と証跡を引き継ぎます。')}<div class="scope-banner"><strong>共通なのは業務枠組みです。</strong><p>システム上の正式項目名、対象年度、単位、必須条件は、当該年度の操作手引・認証後画面・都道府県通知で上書きしてください。未確認の欄を推測で埋めたり、未受領を0にしたりしません。</p><p><strong>APP-から始まるIDはアプリ内の集約進捗IDです。</strong> Excel詳細台帳のA01等とは別体系であり、IDによる結合・転記は禁止です。詳細資料台帳はExcelを正本にしてください。</p></div><div class="grid g3"><div class="card metric"><div class="label">一次登録まで</div><div class="value">${first}</div><div class="sub">公式根拠・基礎データ・暫定可否</div></div><div class="card metric"><div class="label">計画確定まで</div><div class="value">${final}</div><div class="sub">正式係数・費用・保険料・最終承認</div></div><div class="card metric"><div class="label">入力禁止</div><div class="value">1</div><div class="sub">住民個票・被保険者番号・認証情報</div></div></div><div class="legend"><span class="input">薄黄＝自治体・担当者入力</span><span class="calc">青＝自動表示・検算</span><span class="blocked">赤＝未解消なら出力不可</span></div><div class="card"><div class="scrollhint">横にスクロールできます</div><div class="table-wrap"><table class="table"><thead><tr><th>アプリ集約ID・段階</th><th>資料／データ</th><th>システム上の正式項目名</th><th>対象年度</th><th>単位</th><th>出典資料</th><th>基準日</th><th>必須度</th><th>入力・対応区分</th><th>どこを見るか</th><th>状況</th><th>所管・依頼先</th><th>期限</th><th>受領日</th><th>証跡参照</th><th>メモ</th></tr></thead><tbody>${REQUESTS.map(r=>{const p=`requests.${r.id}`,x=state.requests[r.id],appId=`APP-${r.id}`;if(r.id==='D01')return `<tr class="invalid"><td class="nowrap"><strong>${appId}</strong><br>${statusPill('全段階')}</td><td><strong>${h(r.name)}</strong><br><span class="hint">${h(r.detail)}</span></td><td colspan="5"><strong class="bad">入力禁止</strong><br>この行には値・担当者・期限・証跡を登録しません。</td><td>${statusPill('禁止')}</td><td>${statusPill('入力しない')}</td><td>${h(r.whereToLook)}</td><td>${statusPill('対象外')}</td><td colspan="5">住民個票、被保険者番号、氏名・住所、システムID・パスワードを本ファイルへ持ち込まない。</td></tr>`;return `<tr><td class="nowrap"><strong>${appId}</strong><br>${statusPill(x.phase)}<br><span class="hint">${h(r.category)}</span></td><td><strong>${h(r.name)}</strong><br><span class="hint">${h(r.detail)}</span></td><td class="inputcell">${input(p+'.systemItem','text',`placeholder="${h(r.systemItem)}"`)}</td><td>${input(p+'.targetYears','text',`placeholder="${h(r.targetYears)}"`)}</td><td>${input(p+'.unit','text',`placeholder="${h(r.unit)}"`)}</td><td>${input(p+'.sourceExpected','text',`placeholder="${h(r.sourceExpected)}"`)}</td><td>${input(p+'.baseDate','text',`placeholder="${h(r.baseDateGuide)}"`)}</td><td>${select(p+'.mandatory',['要確認','必須','条件付き','任意','対象外'])}</td><td>${select(p+'.actor',[['自治体','自治体'],['当社','支援事業者'],['自治体＋当社','自治体＋支援事業者'],['自治体入力／当社検証','自治体入力／支援事業者検証'],['自治体判断／当社記録','自治体判断／支援事業者記録']])}</td><td>${input(p+'.whereToLook')}</td><td>${select(p+'.status',STATUS_OPTIONS)}</td><td>${input(p+'.owner')}</td><td>${input(p+'.due','date')}</td><td>${input(p+'.received','date')}</td><td>${input(p+'.sourceRef')}</td><td>${input(p+'.note')}</td></tr>`}).join('')}</tbody></table></div><p class="hint">担当者名など業務連絡情報は必要最小限にし、組織の情報管理ルールに従ってください。住民・被保険者の個人単位情報と認証情報は入力禁止です。必須度を初期区分から変更する場合、証跡参照と理由メモが必要です。</p></div>`}
function methodChoiceSelect(path,current){const valid=state.estimation.registry.filter(methodCanSelect),selected=valid.some(r=>r.id===current),extra=current&&!selected?`<option value="${h(current)}" selected>現在値 ${h(current)}（確認失効）</option>`:'';return `<select data-path="${h(path)}"><option value="">選択してください</option>${extra}${valid.map(r=>`<option value="${h(r.id)}" ${r.id===current?'selected':''}>${h(r.id)}｜${h(r.label)}</option>`).join('')}</select>`}

function materialApplies(r,stage=state.stage){if(r.category.startsWith('D：'))return false;return stage==='first'?['一次登録まで','一次・最終共通'].includes(r.phase):true}
function materialRowsForPhase(mode=state.ui.requestPhase||'current'){if(mode==='all')return MATERIALS;if(mode==='prohibited')return MATERIALS.filter(r=>r.category.startsWith('D：'));if(mode==='first')return MATERIALS.filter(r=>materialApplies(r,'first'));if(mode==='final')return MATERIALS.filter(r=>materialApplies(r,'final'));return MATERIALS.filter(r=>materialApplies(r,state.stage))}
function filteredMaterialRows(){const category=state.ui.requestCategory||'all',status=state.ui.requestStatus||'all',q=String(state.ui.requestSearch||'').trim().toLowerCase();return materialRowsForPhase().filter(r=>{const x=state.materials[r.id];if(category!=='all'&&r.category!==category)return false;if(status!=='all'&&x.status!==status)return false;if(!q)return true;return [r.id,r.phase,r.category,r.name,r.ask,r.why,r.ownerGuide,r.preferredFormat,r.sourceExpected,r.whereToLook,r.check,...Object.values(x)].join(' ').toLowerCase().includes(q)})}
function materialStats(rows=materialRowsForPhase('current')){const active=rows.filter(r=>!r.category.startsWith('D：')),count=s=>active.filter(r=>s.includes(state.materials[r.id].status)).length;return{total:active.length,confirmed:count(['確定受領']),arrived:count(['一部受領','受領・要確認']),notRequested:count(['未依頼']),requested:count(['依頼済'])}}
fingerprintOf=function(x,appVersion=x.appVersion,calcVersion=x.calcVersion){const o={appVersion,calcVersion,caseStatus:x.caseStatus,stage:x.stage,profile:x.profile,notice:x.notice,materials:x.materials,requests:x.requests,population:x.population,recognition:x.recognition,serviceData:x.serviceData,estimation:x.estimation,community:x.community,premium:x.premium,mapping:x.mapping};return sha256(JSON.stringify(o))};
completeness=function(){let total=0,done=0;const add=v=>{total++;if(v!==null&&v!==undefined&&v!=='')done++};['prefecture','municipality','insurerCode','localCode'].forEach(k=>add(state.profile[k]));['title','specVersion','templateName'].forEach(k=>add(state.notice[k]));materialRowsForPhase('current').forEach(r=>{total++;if(['確定受領','対象外'].includes(state.materials[r.id]?.status))done++});SERVICES.filter(s=>!s.validTo).forEach(s=>YEARS_F.forEach(y=>['users','volume','cost'].forEach(m=>add(calcService(s.code,y,m).output))));return{total,done,pct:total?Math.round(done/total*100):0}};

const actionV8=action;
action=function(a){if(a==='export-municipality-request')return exportMunicipalityRequest();if(a==='export-material-tracker')return exportMaterialTracker();return actionV8(a)};
const bindDynamicV8=bindDynamic;
bindDynamic=function(){bindDynamicV8();const bindSelect=(id,key)=>{const el=$(id);if(el)el.onchange=()=>{state.ui[key]=el.value;queueSave();render()}};bindSelect('#requestPhase','requestPhase');bindSelect('#requestStatus','requestStatus');bindSelect('#requestCategory','requestCategory');const rs=$('#requestSearch');if(rs)rs.oninput=()=>{state.ui.requestSearch=rs.value;queueSave();const pos=rs.selectionStart;renderDebounced(300);setTimeout(()=>{const x=$('#requestSearch');if(x){x.focus();x.setSelectionRange(pos,pos)}},330)};$$('[data-path^="materials."]').forEach(el=>el.addEventListener('change',()=>renderDebounced()))};
const renderExportV8=renderExport;

$('#caseSelect').onchange=e=>{if(!save()){e.target.value=state.id;return}state=store.cases[e.target.value];store.current=state.id;render()};$('#newCase').onclick=()=>{if(!save())return;$('#newPref').value='';$('#newMunicipality').value='';$('#newInsurer').value='';$('#newLocalCode').value='';$('#caseDialog').showModal()};$('#copyCase').onclick=()=>{if(!save())return;if(!confirm('全国共通の空様式を新規作成します。現在ケースの自治体情報、数値、出典、通知、対応表、承認・登録証跡はコピーしません。'))return;const beforeStore=clone(store),beforeId=state.id,c=defaultCase();store.cases[c.id]=c;state=c;if(!save()){store=beforeStore;state=store.cases[beforeId];render();return}render();alert('自治体データを含まない空様式を作成しました。自治体・県通知から設定してください。')};$('#deleteCase').onclick=()=>{if(state.caseStatus==='無効'){if(!confirm(`「${caseLabel(state)}」を再有効化しますか？ 過去の無効化日時・理由は保持します。`))return;state.caseStatus='有効';invalidateApproval('caseStatus');queueSave();render();return}const reason=prompt('ケースを削除せず無効化します。理由を入力してください。');if(reason===null)return;if(!nonBlank(reason))return alert('無効化理由は必須です。');if(!confirm(`「${caseLabel(state)}」を無効化しますか？ 入力値は保持されますが、再有効化するまで出力できません。`))return;state.caseStatus='無効';state.invalidatedAt=new Date().toISOString();state.invalidationReason=reason.trim();invalidateApproval('caseStatus');queueSave();render()};$('#confirmNew').onclick=e=>{e.preventDefault();const pref=$('#newPref').value,name=$('#newMunicipality').value.trim();if(!pref||!name)return alert('都道府県と自治体名を入力してください。');const beforeStore=clone(store),beforeId=state.id,c=defaultCase(pref,name,$('#newInsurer').value.trim(),$('#newLocalCode').value.trim());store.cases[c.id]=c;state=c;if(!save()){store=beforeStore;state=store.cases[beforeId];render();return}$('#caseDialog').close();render()};
